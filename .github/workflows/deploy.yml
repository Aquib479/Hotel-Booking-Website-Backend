name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:

# The EC2 box has one app directory; overlapping deploys would corrupt it.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npm test --if-present

      # Only compiled output and the dependency manifests are shipped. node_modules
      # is installed on the instance because bcrypt is a native ARM64 module and
      # cannot be cross-built on an x64 runner.
      - name: Package release
        run: tar -czf ../../release.tar.gz dist package.json package-lock.json ecosystem.config.js

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Copy release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: /home/ec2-user/incoming

      - name: Activate release
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            APP_DIR=/home/ec2-user/RestHalfV2/apps/api
            STAGE=$(mktemp -d)

            tar -xzf /home/ec2-user/incoming/release.tar.gz -C "$STAGE"

            cd "$APP_DIR"

            # Keep the previous build so a failed health check can roll back.
            rm -rf dist.prev
            [ -d dist ] && cp -r dist dist.prev

            cp -r "$STAGE/dist" dist.new
            cp "$STAGE/package.json" "$STAGE/package-lock.json" "$STAGE/ecosystem.config.js" .

            rm -rf dist && mv dist.new dist
            rm -rf "$STAGE" /home/ec2-user/incoming/release.tar.gz

            npm ci --omit=dev

            pm2 reload resthalfv2-api --update-env

            # Give the process a moment, then verify it actually serves traffic.
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3001 >/dev/null 2>&1; then
                echo "Health check passed"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed, rolling back"
            if [ -d dist.prev ]; then
              rm -rf dist && mv dist.prev dist
              pm2 reload resthalfv2-api --update-env
            fi
            exit 1
